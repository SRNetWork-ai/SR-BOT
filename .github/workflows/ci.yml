name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, mbstring, json, zip, openssl
          coverage: none
          tools: none

      - name: php -l (tools/lint.sh)
        run: bash tools/lint.sh

      - name: version.json is valid JSON
        run: php -r '$j = json_decode(file_get_contents("version.json"), true); if (!is_array($j) || empty($j["version"]) || empty($j["build"])) { fwrite(STDERR, "version.json invalid\\n"); exit(1);} echo "version={$j["version"]} build={$j["build"]}\\n";'

      - name: Migrations are numbered and unique
        run: |
          set -e
          ls database/migrations/*.sql | sed 's#.*/##' | cut -d_ -f1 | sort | uniq -d | grep . && { echo 'duplicate migration number'; exit 1; } || echo 'migration numbers OK'

  phpstan:
    name: PHPStan (level from phpstan.neon.dist)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, json
          coverage: none
          tools: phpstan
      - name: Analyse
        run: phpstan analyse -c phpstan.neon.dist --no-progress --error-format=github || true
