name: Maintenance fixups

on:
  push:
    paths:
      - '.github/workflows/fixups.yml'
      - '.github/scripts/fixups.py'
  workflow_dispatch:
    inputs:
      min_php:
        description: 'min_php written into version.json'
        required: false
        default: '8.1'
      build:
        description: 'build written into version.json (empty = script default)'
        required: false
        default: ''
      message:
        description: 'commit message (empty = default)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fixups
  cancel-in-progress: false

jobs:
  fixups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixups
        env:
          MIN_PHP: ${{ github.event.inputs.min_php }}
          NEW_BUILD: ${{ github.event.inputs.build }}
        run: |
          set +e
          python3 --version > .github/fixups-last-run.txt 2>&1
          date -u >> .github/fixups-last-run.txt
          python3 .github/scripts/fixups.py >> .github/fixups-last-run.txt 2>&1
          code=$?
          echo "exit: $code" >> .github/fixups-last-run.txt
          cat .github/fixups-last-run.txt
          exit 0

      - name: Commit and push
        env:
          MSG: ${{ github.event.inputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m "${MSG:-feat(logs): self-healing telegram topics, offline queue, dedup and silent topics}"
            git push
          fi
