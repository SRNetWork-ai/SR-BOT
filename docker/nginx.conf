# SR-BOT — وی‌هاست nginx کانتینر (mount روی /etc/nginx/conf.d/default.conf)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 64m;

    access_log /var/log/nginx/sr-bot.access.log;
    error_log  /var/log/nginx/sr-bot.error.log;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # مسیرهای داخلی که نباید از وب باز شوند
    location ~ ^/(app|database|cron|tools|docker|\.github)/ {
        deny all;
        return 404;
    }

    location ~ ^/storage/(logs|backups|updates|receipts|tmp)/ {
        deny all;
        return 404;
    }

    location ~ ^/(config\.php|config\.sample\.php|composer\.json|composer\.lock|install\.sh|docker-compose\.yml|Dockerfile|phpstan\.neon\.dist)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 180;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
