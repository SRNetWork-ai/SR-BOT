# SR-BOT — اجرا با داکر (اختیاری)
# ۱) cp .env.docker.example .env  و مقدارها را عوض کنید
# ۲) docker compose up -d --build
# ۳) http://SERVER_IP:8080/install/ را باز کنید — در نصاب وب، هاست دیتابیس را db بنویسید

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-srbot_root}
      MARIADB_DATABASE: ${DB_NAME:-srbot}
      MARIADB_USER: ${DB_USER:-srbot}
      MARIADB_PASSWORD: ${DB_PASS:-srbot_pass}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ:-Asia/Tehran}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    image: sr-bot:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      SRB_PORT: ${WEB_PORT:-8080}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - ./:/var/www/html

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cron:
    image: sr-bot:local
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - app
    user: "www-data"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      CRON_INTERVAL: ${CRON_INTERVAL:-300}
      TZ: ${TZ:-Asia/Tehran}
    entrypoint: ["/bin/sh", "/var/www/html/docker/cron.sh"]
    volumes:
      - ./:/var/www/html

volumes:
  dbdata:
